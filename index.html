<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasapalabra - Menú Principal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0f172a;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.2rem;
      text-align: center;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      margin-bottom: 2rem;
      text-align: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 350px;
    }
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: 1.25rem;
      transition: transform 0.2s, box-shadow 0.2s;
      text-align: center;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-tv {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    .btn-control {
      background: linear-gradient(135deg, #ea580c, #d97706);
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.4);
    }
    .btn span {
      font-size: 0.85rem;
      font-weight: normal;
      opacity: 0.9;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <h1>Pasapalabra</h1>
  <p>Selecciona el modo según el dispositivo:</p>

  <div class="container">
    <a href="rosco.html" class="btn btn-tv">
      📺 Pantalla TV (Rosco)
      <span>Para abrir en la Smart TV</span>
    </a>

    <a href="control.html" class="btn btn-control">
      📱 Celular (Control)
      <span>Para el organizador del juego</span>
    </a>
  </div>

</body>
</html>
